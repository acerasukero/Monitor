        input.addEventListener("change", () => resolve(input.files?.[0] || null), { once: true });
        input.click();
      });
    }

    function editImageFile(file) {
      return new Promise((resolve) => {
        const editor = el("imageeditor");
        const canvas = el("imageeditorcanvas");
        const maskselect = el("imagemask");
        const zoominput = el("imagezoom");
        const confirmbtn = el("imageconfirmbtn");
        const cancelbtn = el("imagecancelbtn");
        const ctx = canvas.getContext("2d");
        const url = URL.createObjectURL(file);
        const image = new Image();
        let offsetx = 0;
        let offsety = 0;
        let baseScale = 1;
        let dragging = false;
        let lastx = 0;
        let lasty = 0;

        const cleanup = (result) => {
          URL.revokeObjectURL(url);
          editor.classList.add("hidden");
          canvas.classList.remove("dragging");
          confirmbtn.onclick = null;
          cancelbtn.onclick = null;
          maskselect.onchange = null;
          zoominput.oninput = null;
          canvas.onpointerdown = null;
          canvas.onpointermove = null;
          canvas.onpointerup = null;
          canvas.onpointercancel = null;
          resolve(result);
        };

        const resetView = () => {
          offsetx = 0;
          offsety = 0;
          zoominput.value = "1";
          updateBaseScale();
          renderImageEditorPreview(image, ctx, maskselect.value, baseScale, Number(zoominput.value), offsetx, offsety);
        };

        const updateBaseScale = () => {
          baseScale = maskselect.value === "original"
            ? Math.min(canvas.width / image.width, canvas.height / image.height)
            : Math.max(canvas.width / image.width, canvas.height / image.height);
          zoominput.disabled = maskselect.value === "original";
        };

        maskselect.onchange = resetView;
        zoominput.oninput = () => renderImageEditorPreview(image, ctx, maskselect.value, baseScale, Number(zoominput.value), offsetx, offsety);

        canvas.onpointerdown = (event) => {
          if (maskselect.value === "original") return;
          dragging = true;
          canvas.classList.add("dragging");
          canvas.setPointerCapture(event.pointerId);
          const point = canvasPoint(canvas, event);
          lastx = point.x;
          lasty = point.y;
        };
        canvas.onpointermove = (event) => {
          if (!dragging) return;
          const point = canvasPoint(canvas, event);
          offsetx += point.x - lastx;
          offsety += point.y - lasty;
          lastx = point.x;
          lasty = point.y;
          renderImageEditorPreview(image, ctx, maskselect.value, baseScale, Number(zoominput.value), offsetx, offsety);
        };
        canvas.onpointerup = (event) => {
          dragging = false;
          canvas.classList.remove("dragging");
          canvas.releasePointerCapture(event.pointerId);
        };
        canvas.onpointercancel = () => {
          dragging = false;
          canvas.classList.remove("dragging");
        };

        cancelbtn.onclick = () => cleanup(null);
        confirmbtn.onclick = () => {
          if (maskselect.value === "original") {
            cleanup(file);
            return;
          }
          renderImageEditorPreview(image, ctx, maskselect.value, baseScale, Number(zoominput.value), offsetx, offsety);
          canvas.toBlob((blob) => {
            if (!blob) {
              cleanup(null);
              showToast("图片处理失败", "error", 5200);
              return;
            }
            cleanup(new File([blob], pngFilename(file.name), { type: "image/png" }));
          }, "image/png");
        };

        image.onload = () => {
          maskselect.value = "original";
          editor.classList.remove("hidden");
          resetView();
        };
        image.onerror = () => {
          cleanup(null);
          showToast("图片读取失败", "error", 5200);
        };
        image.src = url;
      });
    }

    function renderImageEditorPreview(image, ctx, mask, baseScale, zoom, offsetx, offsety) {
      const size = ctx.canvas.width;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      if (mask !== "original") {
        applyImageMask(ctx, mask, size);
      }
      const scale = baseScale * zoom;
      const width = image.width * scale;
      const height = image.height * scale;
      const x = (size - width) / 2 + offsetx;
      const y = (size - height) / 2 + offsety;
      ctx.drawImage(image, x, y, width, height);
      ctx.restore();
    }

    function applyImageMask(ctx, mask, size) {
      ctx.beginPath();
      if (mask === "circle") {
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      } else if (mask === "rounded") {
        roundedRectPath(ctx, 0, 0, size, size, 88);
      } else {
        ctx.rect(0, 0, size, size);
      }
      ctx.clip();
    }

    function roundedRectPath(ctx, x, y, width, height, radius) {
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function canvasPoint(canvas, event) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      return {
        x: (event.clientX - rect.left) * scale,
        y: (event.clientY - rect.top) * scale,
      };
    }

    function pngFilename(name) {
      return `${name.replace(/\.[^.]*$/, "") || "image"}.png`;
    }

    function syncJsonToState() {
      if (state.activeTab !== "json") return;
      state.config = normalizeConfig(JSON.parse(el("jsoneditor").value));
    }

    function bindEvents() {
      state.config = normalizeConfig(null);
      applySettings();

      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          if (state.activeTab === "json") syncJsonToState();
          state.activeTab = button.dataset.tab;
          render();
        });
      });

      el("undobtn").addEventListener("click", () => {
        if (!state.dirty) return;
        state.config = normalizeConfig(JSON.parse(state.savedjson));
        render();
        state.dirty = false;
        updateDirtyUi();
        setStatus("已撤销未保存改动", "ok");
      });
      el("savebtn").addEventListener("click", () => saveConfig().catch((error) => {
        if (error.data?.errors || error.data?.warnings) {
          state.validation = error.data;
          renderMessages();
        }
        setStatus(error.message, "error");
      }));
      el("runbtn").addEventListener("click", () => runWorkflow().catch((error) => setStatus(error.message, "error")));

      el("additembtn").addEventListener("click", addItem);
      el("newsource").addEventListener("change", syncNewSourceFields);
      el("sourcefilter").addEventListener("change", renderItems);
      el("groupfilter").addEventListener("change", renderItems);
      el("searchinput").addEventListener("input", renderItems);
      el("displaylevel").addEventListener("change", () => {
        state.display.level = el("displaylevel").value;
        state.display.owner = "";
        renderDisplay();
      });
      el("displayowner").addEventListener("change", () => {
        state.display.owner = el("displayowner").value;
        renderDisplay();
      });

      el("defaultgroupinput").addEventListener("change", () => {
        const olddefault = state.config.default_group;
        const next = el("defaultgroupinput").value.trim();
        if (olddefault && state.config.bark_archive_mapping[olddefault] && olddefault !== next) {
          state.config.bark_archive_mapping[next] = state.config.bark_archive_mapping[olddefault];
          delete state.config.bark_archive_mapping[olddefault];
        }
        state.config.default_group = next;
        render();
        markDirty();
      });
      el("defaulticoninput").addEventListener("change", () => {
        state.config.default_icon = el("defaulticoninput").value.trim();
        renderJson();
        markDirty();
      });
      el("defaultarchiveinput").addEventListener("change", () => {
        if (state.config.default_group) state.config.bark_archive_mapping[state.config.default_group] = el("defaultarchiveinput").value.trim();
        renderJson();
        markDirty();
      });
      el("addgroupbtn").addEventListener("click", () => {
        let base = "新分组";
        let name = base;
        let count = 2;
        while (state.config.notification_groups[name]) name = `${base}${count++}`;
        state.config.notification_groups[name] = [];
        state.config.notification_icons[name] = "";
        state.config.bark_archive_mapping[name] = name;
        render();
        markDirty();
      });

      el("applyjsonbtn").addEventListener("click", () => {
        try {
          syncJsonToState();
          render();
          markDirty();
          setStatus("JSON 已应用", "ok");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });
      el("formatjsonbtn").addEventListener("click", () => {
        try {
          syncJsonToState();
          renderJson();
          markDirty();
          setStatus("已格式化", "ok");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });
      el("jsoneditor").addEventListener("input", () => {
        if (state.activeTab !== "json") return;
        try {
          state.config = normalizeConfig(JSON.parse(el("jsoneditor").value));
          markDirty();
        } catch (error) {
          state.validation = { ok: false, errors: [`JSON: ${error.message}`], warnings: [] };
          renderMessages();
          setStatus("JSON 格式错误", "error");
        }
      });

      bindSettingsEvents();
      bindStaticUploadEvents();
      window.addEventListener("beforeunload", (event) => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = "";
      });
      render();
      if (workerurl()) {
        loadConfigWithRetry().catch(() => {});
        refreshLatestRun().catch(() => {});
      } else {
        setStatus("请先在设置中填写 Worker URL", "warn");
      }
    }

    function bindStaticUploadEvents() {
      document.querySelectorAll("[data-upload-target]").forEach((button) => {
        button.addEventListener("click", async () => {
          const targetid = button.dataset.uploadTarget;
          const input = el(targetid);
          await uploadToInput(input, button, (url) => {
            if (targetid === "newmedia") return;
            if (targetid === "defaulticoninput") {
              state.config.default_icon = url;
              renderJson();
              markDirty();
              return;
            }
            if (targetid === "settinglogourl") {
              state.settings.logourl = url;
              refreshAssetVersion();
              saveSettings();
              return;
            }
            if (targetid === "settingfaviconurl") {
              state.settings.faviconurl = url;
              refreshAssetVersion();
              saveSettings();
            }
          });
        });
      });
    }

    function bindSettingsEvents() {
      const map = {
        workerurl: "workerurl",
        webuitoken: "webuitoken",
        settingbrandname: "brandname",
        settingpagetitle: "pagetitle",
        settingtimezone: "timezone",
        settinglogourl: "logourl",
        settingfaviconurl: "faviconurl",
      };
      for (const [id, key] of Object.entries(map)) {
        const eventname = el(id).tagName === "SELECT" ? "change" : "input";
        el(id).addEventListener(eventname, () => {
          state.settings[key] = el(id).value.trim();
          if (key === "logourl" || key === "faviconurl") refreshAssetVersion();
          saveSettings();
          if (key === "timezone") refreshLatestRun().catch(() => {});
        });
      }
      el("settingtheme").addEventListener("change", () => {
        const theme = el("settingtheme").value;
        state.settings.theme = theme;
        if (theme !== "custom") state.settings.colors = { ...THEMES[theme] };
        saveSettings();
      });
      for (const [id, key] of Object.entries({
        colorbg: "bg",
        colorsidebar: "sidebar",
        colorpanel: "panel",
        colortext: "text",
        colormuted: "muted",
        coloraccent: "accent",
      })) {
        el(id).addEventListener("input", () => {
          state.settings.theme = "custom";
          state.settings.colors[key] = el(id).value;
          saveSettings();
        });
      }
    }

    function safeJson(raw, fallback) {
      try { return JSON.parse(raw); } catch { return fallback; }
    }

    function refreshAssetVersion() {
      state.settings.assetversion = Date.now();
    }

    function sleep(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function getSupportedTimezones() {
      if (Intl.supportedValuesOf) {
        return Intl.supportedValuesOf("timeZone");
      }
      return [
        "UTC",
        "Asia/Hong_Kong",
        "Asia/Shanghai",
        "Asia/Tokyo",
        "Asia/Seoul",
        "Asia/Singapore",
        "Asia/Taipei",
        "Europe/London",
        "Europe/Paris",
        "America/New_York",
        "America/Los_Angeles",
      ];
    }

    function timezoneLabel(timezone) {
      return timezone.replace(/_/g, " ");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function mixHex(a, b, amount) {
      const pa = parseHex(a);
      const pb = parseHex(b);
      if (!pa || !pb) return "#d9f0ec";
      const c = pa.map((part, index) => Math.round(part * (1 - amount) + pb[index] * amount));
      return `#${c.map((part) => part.toString(16).padStart(2, "0")).join("")}`;
    }

    function parseHex(value) {
      const match = /^#?([0-9a-f]{6})$/i.exec(value || "");
      if (!match) return null;
      return [0, 2, 4].map((offset) => parseInt(match[1].slice(offset, offset + 2), 16));
    }

    bindEvents();
  </script>
