<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor Config</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --line: #d9ded6;
      --line-strong: #b7c0b3;
      --text: #1f2a24;
      --muted: #66736b;
      --accent: #0f766e;
      --accent-soft: #d9f0ec;
      --warn: #b45309;
      --danger: #b42318;
      --danger-soft: #fbe4e2;
      --ok: #16774b;
      --shadow: 0 10px 30px rgba(32, 42, 36, 0.08);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line-strong);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      background: var(--danger-soft);
      border-color: #f0aaa3;
      color: var(--danger);
    }

    button.icon {
      width: 36px;
      padding: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
      outline: none;
    }

    textarea {
      min-height: 520px;
      resize: vertical;
      font-family: Consolas, "Cascadia Mono", monospace;
      line-height: 1.45;
      white-space: pre;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
      background: rgba(246, 247, 244, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #22352c;
      color: #fff;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 58vw;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: #eef1eb;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 650;
    }

    .nav button.active {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
      box-shadow: var(--shadow);
    }

    .connection {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .content {
      min-width: 0;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 74px;
      box-shadow: var(--shadow);
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      line-height: 1;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
    }

    .tools {
      display: grid;
      grid-template-columns: 150px 150px minmax(180px, 1fr);
      gap: 8px;
      width: min(620px, 100%);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      padding: 12px;
      align-items: end;
    }

    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-12 { grid-column: 1 / -1; }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 330px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9faf8;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    td.tight {
      width: 44px;
    }

    td.platform {
      width: 120px;
      font-weight: 700;
      color: #2b463a;
    }

    .checks {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .checks input {
      width: 16px;
      min-height: 16px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fff;
    }

    .status.ok {
      border-color: #a7d6bf;
      color: var(--ok);
      background: #effaf4;
    }

    .status.error {
      border-color: #f0aaa3;
      color: var(--danger);
      background: var(--danger-soft);
    }

    .status.warn {
      border-color: #f2c27b;
      color: var(--warn);
      background: #fff7e8;
    }

    .messages {
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .messages ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .group-list {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .group-row {
      display: grid;
      grid-template-columns: minmax(140px, 1.1fr) minmax(220px, 2fr) minmax(160px, 1.2fr) 44px;
      gap: 10px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .json-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 980px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .connection {
        grid-template-columns: 1fr 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tools,
      .group-row {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .span-2,
      .span-3,
      .span-4,
      .span-5,
      .span-6,
      .span-12 {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">M</div>
        <div>
          <h1>监控配置</h1>
          <p id="repoLine">未连接</p>
        </div>
      </div>
      <div class="actions">
        <div id="status" class="status">等待加载</div>
        <button id="loadBtn">读取</button>
        <button id="validateBtn">校验</button>
        <button id="saveBtn" class="primary">保存</button>
        <button id="runBtn">运行</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav class="nav">
          <button data-tab="items" class="active">监控项</button>
          <button data-tab="groups">分组</button>
          <button data-tab="display">显示</button>
          <button data-tab="json">JSON</button>
        </nav>
        <div class="connection">
          <label>Worker URL
            <input id="workerurl" placeholder="https://your-worker.workers.dev">
          </label>
          <label>WebUI Token
            <input id="webuitoken" type="password" autocomplete="off">
          </label>
        </div>
      </aside>

      <section class="content">
        <div class="summary" id="summary"></div>

        <section id="itemsTab" class="panel">
          <div class="panel-head">
            <h2 class="panel-title">监控项</h2>
            <div class="tools">
              <select id="typeFilter"></select>
              <select id="groupFilter"></select>
              <input id="searchInput" placeholder="搜索名称、ID、地区">
            </div>
          </div>
          <div class="form-grid">
            <label class="span-2">类型
              <select id="newType"></select>
            </label>
            <label class="span-3">名称
              <input id="newName">
            </label>
            <label class="span-3" id="newTargetLabel">目标
              <input id="newTarget">
            </label>
            <label class="span-2" id="newRegionLabel">地区
              <input id="newRegion">
            </label>
            <label class="span-2">分组
              <select id="newGroup"></select>
            </label>
            <label class="span-5" id="newRegexLabel">RSS 正则
              <input id="newRegex">
            </label>
            <label class="span-5">富媒体
              <input id="newMedia">
            </label>
            <button id="addItemBtn" class="primary span-2">添加</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>类型</th>
                  <th>名称</th>
                  <th>目标</th>
                  <th>地区</th>
                  <th>分组</th>
                  <th>RSS 正则</th>
                  <th>富媒体</th>
                  <th>构建号</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
        </section>

        <section id="groupsTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">分组</h2>
            <button id="addGroupBtn" class="primary">添加分组</button>
          </div>
          <div class="form-grid">
            <label class="span-4">默认分组
              <input id="defaultGroupInput">
            </label>
            <label class="span-8">默认图标
              <input id="defaultIconInput">
            </label>
          </div>
          <div id="groupList" class="group-list"></div>
        </section>

        <section id="displayTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">全局显示</h2>
          </div>
          <div id="displayGrid" class="form-grid"></div>
        </section>

        <section id="jsonTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">JSON</h2>
          </div>
          <div class="form-grid">
            <label class="span-12">config.json
              <textarea id="jsonEditor" spellcheck="false"></textarea>
            </label>
          </div>
          <div class="json-actions">
            <button id="applyJsonBtn">应用 JSON</button>
            <button id="formatJsonBtn">格式化</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">校验结果</h2>
          </div>
          <div class="messages" id="messages"></div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const LISTS = {
      "App Store": { key: "app_store_list", target: "App ID", region: true, defaultRegion: "cn" },
      "Google Play": { key: "google_play_list", target: "包名", region: true, defaultRegion: "us" },
      "TapTap": { key: "taptap_list", target: "TapTap ID", region: false },
      "GitHub": { key: "github_repo_list", target: "owner/repo", region: false },
      "RSS": { key: "rss_list", target: "RSS 链接", region: false },
    };
    const PLATFORMS = Object.keys(LISTS);
    const storage = window.localStorage;

    let state = {
      config: null,
      sha: null,
      validation: null,
      activeTab: "items",
    };

    const el = (id) => document.getElementById(id);

    function baseConfig() {
      return {
        app_store_list: [],
        google_play_list: [],
        taptap_list: [],
        github_repo_list: [],
        rss_list: [],
        build_number_check: { global: Object.fromEntries(PLATFORMS.map((p) => [p, false])), groups: {}, apps: {} },
        rss_regex_rules: {},
        suffix_config: { global: Object.fromEntries(PLATFORMS.map((p) => [p, [p, true]])), groups: {}, apps: {} },
        notification_groups: {},
        default_group: "其他更新",
        notification_icons: {},
        default_icon: "",
        rich_media_config: {},
        bark_archive_mapping: {},
      };
    }

    function normalizeConfig(config) {
      const normalized = { ...baseConfig(), ...(config || {}) };
      for (const meta of Object.values(LISTS)) {
        normalized[meta.key] = Array.isArray(normalized[meta.key]) ? normalized[meta.key] : [];
      }
      normalized.build_number_check = {
        global: { ...baseConfig().build_number_check.global, ...(normalized.build_number_check?.global || {}) },
        groups: normalized.build_number_check?.groups || {},
        apps: normalized.build_number_check?.apps || {},
      };
      normalized.suffix_config = {
        global: { ...baseConfig().suffix_config.global, ...(normalized.suffix_config?.global || {}) },
        groups: normalized.suffix_config?.groups || {},
        apps: normalized.suffix_config?.apps || {},
      };
      normalized.notification_groups = normalized.notification_groups || {};
      normalized.rss_regex_rules = normalized.rss_regex_rules || {};
      normalized.notification_icons = normalized.notification_icons || {};
      normalized.rich_media_config = normalized.rich_media_config || {};
      normalized.bark_archive_mapping = normalized.bark_archive_mapping || {};
      return normalized;
    }

    function workerurl() {
      return el("workerurl").value.trim().replace(/\/$/, "");
    }

    function headers() {
      const token = el("webuitoken").value.trim();
      return {
        "Content-Type": "application/json",
        ...(token ? { "Authorization": `Bearer ${token}` } : {}),
      };
    }

    async function api(path, options = {}) {
      const base = workerurl();
      if (!base) {
        throw new Error("Worker URL 为空");
      }
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || data.errors?.join("; ") || `HTTP ${response.status}`);
        error.data = data;
        throw error;
      }
      return data;
    }

    function setStatus(text, kind = "") {
      const target = el("status");
      target.textContent = text;
      target.className = `status ${kind}`.trim();
    }

    function saveConnection() {
      storage.setItem("monitor.workerurl", el("workerurl").value.trim());
      storage.setItem("monitor.webuitoken", el("webuitoken").value.trim());
    }

    function getGroups(includeDefault = true) {
      if (!state.config) return [];
      const groups = Object.keys(state.config.notification_groups || {});
      if (includeDefault && state.config.default_group && !groups.includes(state.config.default_group)) {
        groups.push(state.config.default_group);
      }
      return groups;
    }

    function groupOf(name) {
      for (const [group, names] of Object.entries(state.config.notification_groups || {})) {
        if (Array.isArray(names) && names.includes(name)) {
          return group;
        }
      }
      return state.config.default_group || "";
    }

    function setGroup(name, group) {
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(name);
        if (index >= 0) names.splice(index, 1);
      }
      if (group && group !== state.config.default_group) {
        state.config.notification_groups[group] ||= [];
        if (!state.config.notification_groups[group].includes(name)) {
          state.config.notification_groups[group].push(name);
        }
      }
    }

    function getItems() {
      if (!state.config) return [];
      return PLATFORMS.flatMap((type) => {
        const meta = LISTS[type];
        return (state.config[meta.key] || []).map((item, index) => ({
          type,
          meta,
          index,
          item,
          name: item[0] || "",
          target: item[1] || "",
          region: item[2] || "",
        }));
      });
    }

    function renameItem(oldName, newName) {
      if (!oldName || !newName || oldName === newName) return;
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(oldName);
        if (index >= 0) names[index] = newName;
      }
      moveKey(state.config.rich_media_config, oldName, newName);
      moveKey(state.config.rss_regex_rules, oldName, newName);
      moveKey(state.config.build_number_check.apps, oldName, newName);
      moveKey(state.config.suffix_config.apps, oldName, newName);
    }

    function moveKey(object, oldKey, newKey) {
      if (object && Object.prototype.hasOwnProperty.call(object, oldKey) && !Object.prototype.hasOwnProperty.call(object, newKey)) {
        object[newKey] = object[oldKey];
        delete object[oldKey];
      }
    }

    function setItemField(ref, field, value) {
      const list = state.config[ref.meta.key];
      const item = list[ref.index];
      if (field === "name") {
        const oldName = item[0];
        item[0] = value;
        renameItem(oldName, value);
      }
      if (field === "target") item[1] = value;
      if (field === "region") {
        if (ref.meta.region) item[2] = value;
      }
      render();
    }

    function setAppBuild(name, type, checked) {
      state.config.build_number_check.apps[name] ||= {};
      state.config.build_number_check.apps[name][type] = checked;
      renderJson();
    }

    function render() {
      renderSummary();
      renderFilters();
      renderItems();
      renderGroups();
      renderDisplay();
      renderJson();
      renderMessages();
      renderTab();
    }

    function renderSummary() {
      const summary = el("summary");
      const counts = PLATFORMS.map((type) => [type, state.config ? state.config[LISTS[type].key].length : 0]);
      summary.innerHTML = counts.map(([label, value]) => `<div class="metric"><span>${escapeHtml(label)}</span><strong>${value}</strong></div>`).join("");
    }

    function renderFilters() {
      fillSelect(el("typeFilter"), [["全部类型", ""], ...PLATFORMS.map((p) => [p, p])], el("typeFilter").value);
      fillSelect(el("groupFilter"), [["全部分组", ""], ...getGroups().map((g) => [g, g])], el("groupFilter").value);
      fillSelect(el("newType"), PLATFORMS.map((p) => [p, p]), el("newType").value || "App Store");
      fillSelect(el("newGroup"), getGroups().map((g) => [g, g]), el("newGroup").value || state.config?.default_group || "");
      syncNewTypeFields();
    }

    function renderItems() {
      const body = el("itemsBody");
      if (!state.config) {
        body.innerHTML = "";
        return;
      }

      const typeFilter = el("typeFilter").value;
      const groupFilter = el("groupFilter").value;
      const query = el("searchInput").value.trim().toLowerCase();
      const items = getItems().filter((ref) => {
        const haystack = [ref.type, ref.name, ref.target, ref.region, groupOf(ref.name)].join(" ").toLowerCase();
        return (!typeFilter || ref.type === typeFilter) && (!groupFilter || groupOf(ref.name) === groupFilter) && (!query || haystack.includes(query));
      });

      body.innerHTML = items.map((ref, row) => {
        const group = groupOf(ref.name);
        const regex = state.config.rss_regex_rules[ref.name] || "";
        const media = state.config.rich_media_config[ref.name] || "";
        const build = state.config.build_number_check.apps?.[ref.name]?.[ref.type] || false;
        return `
          <tr data-type="${escapeAttr(ref.type)}" data-index="${ref.index}">
            <td class="platform">${escapeHtml(ref.type)}</td>
            <td><input data-edit="${row}" data-field="name" value="${escapeAttr(ref.name)}"></td>
            <td><input data-edit="${row}" data-field="target" value="${escapeAttr(ref.target)}"></td>
            <td><input data-edit="${row}" data-field="region" value="${escapeAttr(ref.region)}" ${ref.meta.region ? "" : "disabled"}></td>
            <td><select data-edit="${row}" data-field="group">${getGroups().map((g) => `<option value="${escapeAttr(g)}" ${g === group ? "selected" : ""}>${escapeHtml(g)}</option>`).join("")}</select></td>
            <td><input data-edit="${row}" data-field="regex" value="${escapeAttr(regex)}" ${ref.type === "RSS" ? "" : "disabled"}></td>
            <td><input data-edit="${row}" data-field="media" value="${escapeAttr(media)}"></td>
            <td><label class="checks"><input type="checkbox" data-edit="${row}" data-field="build" ${build ? "checked" : ""}>保留</label></td>
            <td class="tight"><button class="icon danger" data-delete="${row}" title="删除">×</button></td>
          </tr>`;
      }).join("");

      body.querySelectorAll("[data-edit]").forEach((node) => {
        node.addEventListener("change", () => {
          const refs = items;
          const ref = refs[Number(node.dataset.edit)];
          const field = node.dataset.field;
          if (field === "group") setGroup(ref.name, node.value);
          if (field === "regex") state.config.rss_regex_rules[ref.name] = node.value;
          if (field === "media") state.config.rich_media_config[ref.name] = node.value;
          if (field === "build") setAppBuild(ref.name, ref.type, node.checked);
          if (["name", "target", "region"].includes(field)) setItemField(ref, field, node.value.trim());
          render();
        });
      });
      body.querySelectorAll("[data-delete]").forEach((node) => {
        node.addEventListener("click", () => {
          const ref = items[Number(node.dataset.delete)];
          state.config[ref.meta.key].splice(ref.index, 1);
          cleanupItem(ref.name);
          render();
        });
      });
    }

    function cleanupItem(name) {
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(name);
        if (index >= 0) names.splice(index, 1);
      }
      delete state.config.rich_media_config[name];
      delete state.config.rss_regex_rules[name];
      delete state.config.build_number_check.apps[name];
      delete state.config.suffix_config.apps[name];
    }

    function renderGroups() {
      if (!state.config) return;
      el("defaultGroupInput").value = state.config.default_group || "";
      el("defaultIconInput").value = state.config.default_icon || "";
      const groupList = el("groupList");
      const groups = Object.keys(state.config.notification_groups || {});
      groupList.innerHTML = groups.map((group) => `
        <div class="group-row" data-group="${escapeAttr(group)}">
          <label>名称<input data-group-field="name" value="${escapeAttr(group)}"></label>
          <label>图标 URL<input data-group-field="icon" value="${escapeAttr(state.config.notification_icons[group] || "")}"></label>
          <label>Bark 归档<input data-group-field="archive" value="${escapeAttr(state.config.bark_archive_mapping[group] || "")}"></label>
          <button class="icon danger" data-delete-group="${escapeAttr(group)}" title="删除">×</button>
        </div>`).join("");

      groupList.querySelectorAll("[data-group-field]").forEach((node) => {
        node.addEventListener("change", () => {
          const oldGroup = node.closest("[data-group]").dataset.group;
          if (node.dataset.groupField === "name") renameGroup(oldGroup, node.value.trim());
          if (node.dataset.groupField === "icon") state.config.notification_icons[oldGroup] = node.value.trim();
          if (node.dataset.groupField === "archive") state.config.bark_archive_mapping[oldGroup] = node.value.trim();
          render();
        });
      });
      groupList.querySelectorAll("[data-delete-group]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.dataset.deleteGroup;
          delete state.config.notification_groups[group];
          delete state.config.notification_icons[group];
          delete state.config.bark_archive_mapping[group];
          delete state.config.build_number_check.groups[group];
          delete state.config.suffix_config.groups[group];
          render();
        });
      });
    }

    function renameGroup(oldGroup, newGroup) {
      if (!oldGroup || !newGroup || oldGroup === newGroup) return;
      state.config.notification_groups[newGroup] = state.config.notification_groups[oldGroup] || [];
      delete state.config.notification_groups[oldGroup];
      moveKey(state.config.notification_icons, oldGroup, newGroup);
      moveKey(state.config.bark_archive_mapping, oldGroup, newGroup);
      moveKey(state.config.build_number_check.groups, oldGroup, newGroup);
      moveKey(state.config.suffix_config.groups, oldGroup, newGroup);
    }

    function renderDisplay() {
      if (!state.config) return;
      const grid = el("displayGrid");
      grid.innerHTML = PLATFORMS.map((platform) => {
        const suffix = state.config.suffix_config.global[platform] || [platform, true];
        const build = Boolean(state.config.build_number_check.global[platform]);
        return `
          <label class="span-3">${escapeHtml(platform)} 后缀
            <input data-display="${escapeAttr(platform)}" data-field="suffixText" value="${escapeAttr(suffix[0] || "")}">
          </label>
          <label class="span-2">显示后缀
            <select data-display="${escapeAttr(platform)}" data-field="suffixVisible">
              <option value="true" ${suffix[1] ? "selected" : ""}>是</option>
              <option value="false" ${!suffix[1] ? "selected" : ""}>否</option>
            </select>
          </label>
          <label class="span-2">保留构建号
            <select data-display="${escapeAttr(platform)}" data-field="build">
              <option value="true" ${build ? "selected" : ""}>是</option>
              <option value="false" ${!build ? "selected" : ""}>否</option>
            </select>
          </label>
          <div class="span-5"></div>`;
      }).join("");

      grid.querySelectorAll("[data-display]").forEach((node) => {
        node.addEventListener("change", () => {
          const platform = node.dataset.display;
          const field = node.dataset.field;
          state.config.suffix_config.global[platform] ||= [platform, true];
          if (field === "suffixText") state.config.suffix_config.global[platform][0] = node.value;
          if (field === "suffixVisible") state.config.suffix_config.global[platform][1] = node.value === "true";
          if (field === "build") state.config.build_number_check.global[platform] = node.value === "true";
          renderJson();
        });
      });
    }

    function renderJson() {
      if (!state.config) return;
      const editor = el("jsonEditor");
      if (document.activeElement !== editor) {
        editor.value = JSON.stringify(state.config, null, 2);
      }
    }

    function renderMessages() {
      const box = el("messages");
      const validation = state.validation;
      if (!validation) {
        box.innerHTML = "<div class=\"status\">暂无校验结果</div>";
        return;
      }
      const errors = validation.errors || [];
      const warnings = validation.warnings || [];
      const errorHtml = errors.length ? `<div class="status error">错误 ${errors.length}</div><ul>${errors.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>` : "<div class=\"status ok\">无错误</div>";
      const warnHtml = warnings.length ? `<div class="status warn">警告 ${warnings.length}</div><ul>${warnings.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>` : "<div class=\"status ok\">无警告</div>";
      box.innerHTML = errorHtml + warnHtml;
    }

    function renderTab() {
      for (const name of ["items", "groups", "display", "json"]) {
        el(`${name}Tab`).classList.toggle("hidden", state.activeTab !== name);
        document.querySelector(`[data-tab="${name}"]`).classList.toggle("active", state.activeTab === name);
      }
    }

    function fillSelect(select, options, value) {
      const current = value ?? select.value;
      select.innerHTML = options.map(([label, val]) => `<option value="${escapeAttr(val)}" ${String(val) === String(current) ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
    }

    function syncNewTypeFields() {
      const type = el("newType").value || "App Store";
      const meta = LISTS[type];
      el("newTargetLabel").firstChild.textContent = `${meta.target}\n`;
      el("newRegionLabel").classList.toggle("hidden", !meta.region);
      el("newRegexLabel").classList.toggle("hidden", type !== "RSS");
      if (meta.region && !el("newRegion").value) {
        el("newRegion").value = meta.defaultRegion || "";
      }
    }

    function addItem() {
      const type = el("newType").value;
      const meta = LISTS[type];
      const name = el("newName").value.trim();
      const target = el("newTarget").value.trim();
      const region = el("newRegion").value.trim() || meta.defaultRegion || "";
      if (!name || !target) {
        setStatus("名称和目标不能为空", "error");
        return;
      }
      const item = meta.region ? [name, target, region] : [name, target];
      state.config[meta.key].push(item);
      setGroup(name, el("newGroup").value);
      const regex = el("newRegex").value.trim();
      const media = el("newMedia").value.trim();
      if (type === "RSS" && regex) state.config.rss_regex_rules[name] = regex;
      if (media) state.config.rich_media_config[name] = media;
      el("newName").value = "";
      el("newTarget").value = "";
      el("newRegex").value = "";
      el("newMedia").value = "";
      render();
      setStatus("已添加", "ok");
    }

    async function loadConfig() {
      saveConnection();
      setStatus("读取中");
      const data = await api("/api/config");
      state.config = normalizeConfig(data.config);
      state.sha = data.sha;
      state.validation = data.validation;
      el("repoLine").textContent = `${data.path || "config.json"} @ ${data.branch || "main"}`;
      render();
      setStatus(data.ok ? "已读取" : "配置有错误", data.ok ? "ok" : "error");
    }

    async function validateConfigRemote() {
      saveConnection();
      syncJsonToState();
      setStatus("校验中");
      let data;
      try {
        data = await api("/api/config/validate", {
          method: "POST",
          body: JSON.stringify({ config: state.config }),
        });
      } catch (error) {
        if (error.data?.errors || error.data?.warnings) {
          data = error.data;
        } else {
          throw error;
        }
      }
      state.validation = data;
      renderMessages();
      setStatus(data.ok ? "校验通过" : "校验失败", data.ok ? "ok" : "error");
      return data.ok;
    }

    async function saveConfig() {
      saveConnection();
      syncJsonToState();
      setStatus("保存中");
      const data = await api("/api/config", {
        method: "PUT",
        body: JSON.stringify({ config: state.config, message: "Update monitor config from WebUI" }),
      });
      state.validation = data.validation;
      renderMessages();
      setStatus("已保存", "ok");
    }

    async function runWorkflow() {
      saveConnection();
      setStatus("触发中");
      const data = await api("/api/run", { method: "POST", body: "{}" });
      setStatus(`已触发 ${data.workflow}`, "ok");
    }

    function syncJsonToState() {
      if (state.activeTab !== "json") return;
      state.config = normalizeConfig(JSON.parse(el("jsonEditor").value));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function bindEvents() {
      el("workerurl").value = storage.getItem("monitor.workerurl") || "";
      el("webuitoken").value = storage.getItem("monitor.webuitoken") || "";
      state.config = normalizeConfig(null);

      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          if (state.activeTab === "json") syncJsonToState();
          state.activeTab = button.dataset.tab;
          render();
        });
      });
      el("loadBtn").addEventListener("click", () => loadConfig().catch((error) => setStatus(error.message, "error")));
      el("validateBtn").addEventListener("click", () => validateConfigRemote().catch(() => {}));
      el("saveBtn").addEventListener("click", () => saveConfig().catch((error) => {
        if (error.data?.errors || error.data?.warnings) {
          state.validation = error.data;
          renderMessages();
        }
        setStatus(error.message, "error");
      }));
      el("runBtn").addEventListener("click", () => runWorkflow().catch((error) => setStatus(error.message, "error")));
      el("addItemBtn").addEventListener("click", addItem);
      el("newType").addEventListener("change", syncNewTypeFields);
      el("typeFilter").addEventListener("change", renderItems);
      el("groupFilter").addEventListener("change", renderItems);
      el("searchInput").addEventListener("input", renderItems);
      el("defaultGroupInput").addEventListener("change", () => {
        state.config.default_group = el("defaultGroupInput").value.trim();
        render();
      });
      el("defaultIconInput").addEventListener("change", () => {
        state.config.default_icon = el("defaultIconInput").value.trim();
        renderJson();
      });
      el("addGroupBtn").addEventListener("click", () => {
        let base = "新分组";
        let name = base;
        let count = 2;
        while (state.config.notification_groups[name]) {
          name = `${base}${count++}`;
        }
        state.config.notification_groups[name] = [];
        state.config.notification_icons[name] = "";
        state.config.bark_archive_mapping[name] = name;
        render();
      });
      el("applyJsonBtn").addEventListener("click", () => {
        try {
          syncJsonToState();
          render();
          setStatus("JSON 已应用", "ok");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });
      el("formatJsonBtn").addEventListener("click", () => {
        try {
          syncJsonToState();
          renderJson();
          setStatus("已格式化", "ok");
        } catch (error) {
          setStatus(error.message, "error");
        }
      });
      render();
    }

    bindEvents();
  </script>
</body>
</html>
