<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor</title>
  <link id="favicon" rel="icon" href="">
  <style>
    :root {
      --bg: #f6f7f4;
      --sidebar: #eef1eb;
      --panel: #ffffff;
      --line: #d9ded6;
      --line-strong: #b7c0b3;
      --text: #1f2a24;
      --muted: #66736b;
      --accent: #0f766e;
      --accent-soft: #d9f0ec;
      --warn: #b45309;
      --danger: #b42318;
      --danger-soft: #fbe4e2;
      --ok: #16774b;
      --shadow: 0 10px 30px rgba(32, 42, 36, 0.08);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: var(--danger-soft); border-color: #f0aaa3; color: var(--danger); }
    button.icon { width: 36px; padding: 0; }

    input, select, textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
      outline: none;
    }

    textarea {
      min-height: 520px;
      resize: vertical;
      font-family: Consolas, "Cascadia Mono", monospace;
      line-height: 1.45;
      white-space: pre;
    }

    input[type="checkbox"] {
      width: 16px;
      min-height: 16px;
      padding: 0;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 14px 18px;
      background: color-mix(in srgb, var(--bg) 92%, white);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .toast-host {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: grid;
      gap: 8px;
      width: min(560px, calc(100vw - 28px));
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 9px 10px 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }

    .toast.ok { border-color: #a7d6bf; color: var(--ok); background: #effaf4; }
    .toast.error { border-color: #f0aaa3; color: var(--danger); background: var(--danger-soft); }
    .toast.warn { border-color: #f2c27b; color: var(--warn); background: #fff7e8; }

    .toast button {
      min-height: 28px;
      width: 28px;
      padding: 0;
    }

    .image-editor-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(18, 24, 20, 0.46);
    }

    .image-editor {
      width: min(760px, 100%);
      max-height: calc(100vh - 36px);
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 260px;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .image-editor-preview {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f2f4f1;
      overflow: hidden;
    }

    .image-editor-preview canvas {
      width: min(100%, 420px);
      aspect-ratio: 1;
      border-radius: 6px;
      background: #fff;
      cursor: grab;
      touch-action: none;
    }

    .image-editor-preview canvas.dragging {
      cursor: grabbing;
    }

    .image-editor-controls {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .image-editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #22352c;
      color: #fff;
      font-weight: 800;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .mark.has-image {
      border-radius: 0;
      background: transparent;
      color: transparent;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 58vw;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: var(--sidebar);
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .nav button.active {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
      box-shadow: var(--shadow);
    }

    .sidepanel {
      display: grid;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .sidepanel h2 {
      margin: 0;
      font-size: 13px;
    }

    .run-status {
      display: grid;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .run-status a {
      color: var(--accent);
      word-break: break-all;
    }

    .failure-summary {
      display: grid;
      gap: 4px;
      padding: 8px 10px;
      border: 1px solid #f0aaa3;
      border-radius: 6px;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .failed-step {
      color: var(--danger);
      font-weight: 750;
    }

    .content {
      min-width: 0;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
    }

    .panel-body {
      padding: 12px;
    }

    #itemsTab {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 74px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      line-height: 1;
    }

    .metric.empty {
      visibility: hidden;
      box-shadow: none;
    }

    .tools {
      display: grid;
      grid-template-columns: 150px 150px minmax(180px, 1fr);
      gap: 8px;
      width: min(620px, 100%);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      align-items: end;
    }

    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: 1 / -1; }

    .source-list {
      display: grid;
      gap: 16px;
    }

    .source-switcher,
    .group-switcher {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .source-switcher.scrollable {
      display: flex;
      grid-template-columns: none;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-snap-type: x proximity;
    }

    .source-switcher.scrollable::-webkit-scrollbar {
      display: none;
    }

    .source-switcher.scrollable .source-switch {
      flex: 0 0 calc((100% - 64px) / 5);
      scroll-snap-align: start;
    }

    .source-switch,
    .group-switch {
      min-height: 38px;
      border-color: var(--line);
      background: transparent;
      color: var(--text);
      font-weight: 700;
    }

    .source-switch.active,
    .group-switch.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }

    .source-pager {
      justify-content: flex-end;
      padding-right: 16px;
    }

    .pager-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pager-dot {
      width: 11px;
      height: 11px;
      min-height: 11px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: transparent;
    }

    .pager-dot.active {
      background: var(--accent);
    }

    .blank-row td {
      height: 53px;
      color: transparent;
      user-select: none;
    }

    .group-item-row.blank-row {
      min-height: 38px;
      color: transparent;
      user-select: none;
    }

    .table-wrap {
      overflow: auto;
      max-height: 58vh;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f9faf8;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    td.tight { width: 44px; }

    .checks {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fff;
    }

    .status.ok { border-color: #a7d6bf; color: var(--ok); background: #effaf4; }
    .status.error { border-color: #f0aaa3; color: var(--danger); background: var(--danger-soft); }
    .status.warn { border-color: #f2c27b; color: var(--warn); background: #fff7e8; }

    .upload-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }

    .upload-field button {
      white-space: nowrap;
    }

    .messages {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 260px);
      overflow: auto;
    }

    .messages ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .group-list {
      display: grid;
      gap: 12px;
    }

    .group-card {
      display: grid;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .group-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(260px, 2fr) minmax(180px, 1.1fr) 124px;
      gap: 10px;
      align-items: end;
    }

    .default-group-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(260px, 2fr) minmax(180px, 1.1fr) 124px;
      gap: 10px;
      align-items: end;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .group-items {
      display: grid;
      gap: 6px;
      padding-left: 10px;
      border-left: 3px solid var(--line);
    }

    .group-items h4 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .group-item-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 124px;
      gap: 10px;
      align-items: center;
    }

    .rule-block {
      display: grid;
      gap: 12px;
    }

    .rule-controls {
      display: grid;
      grid-template-columns: 180px minmax(240px, 1fr);
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .rule-section {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .rule-section h3 {
      margin: 0;
      font-size: 14px;
    }

    .rule-grid {
      display: grid;
      grid-template-columns: 120px 150px minmax(120px, 1fr) 110px minmax(190px, 1fr);
      gap: 8px;
      align-items: center;
    }

    .rule-grid.header {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .setting-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px;
      align-items: end;
    }

    .color-input {
      min-height: 36px;
      padding: 4px;
    }

    .json-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .hidden { display: none !important; }

    @media (max-width: 1060px) {
      .topbar { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .image-editor { grid-template-columns: 1fr; }
      .image-editor-preview { min-height: 260px; }
      .source-switcher { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .source-switcher.scrollable .source-switch { flex-basis: calc((100% - 32px) / 2); }
      .tools, .group-row, .default-group-row, .rule-controls, .rule-grid, .setting-grid, .form-grid {
        grid-template-columns: 1fr;
      }
      .span-2, .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div id="toasthost" class="toast-host"></div>
  <div id="imageeditor" class="image-editor-backdrop hidden" role="dialog" aria-modal="true" aria-label="编辑图片">
    <div class="image-editor">
      <div class="image-editor-preview">
        <canvas id="imageeditorcanvas" width="512" height="512"></canvas>
      </div>
      <div class="image-editor-controls">
        <label>上传方式
          <select id="imagemask">
            <option value="original">原图</option>
            <option value="square">方形裁剪</option>
            <option value="circle">圆形遮罩</option>
            <option value="rounded">圆角遮罩</option>
          </select>
        </label>
        <label>缩放
          <input id="imagezoom" type="range" min="1" max="4" step="0.01" value="1">
        </label>
        <div class="status">遮罩模式下可拖动图片调整位置。</div>
        <div class="image-editor-actions">
          <button id="imagecancelbtn" type="button">取消</button>
          <button id="imageconfirmbtn" class="primary" type="button">确认上传</button>
        </div>
      </div>
    </div>
  </div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div id="brandmark" class="mark">M</div>
        <div>
          <h1 id="brandname">Monitor</h1>
          <p id="repoline">未连接</p>
        </div>
      </div>
      <div class="actions">
        <div id="status" class="status">等待加载</div>
        <div id="topactions" class="top-actions">
          <button id="undobtn">撤销</button>
          <button id="savebtn" class="primary">保存</button>
          <button id="runbtn">运行</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav class="nav">
          <button data-tab="items" class="active">监控项目</button>
          <button data-tab="groups">分组</button>
          <button data-tab="display">后缀与比对</button>
          <button data-tab="json">JSON</button>
          <button data-tab="settings">设置</button>
        </nav>

        <section class="sidepanel">
          <h2>校验结果</h2>
          <div id="messages" class="messages"></div>
        </section>

        <section class="sidepanel">
          <h2>运行状态</h2>
          <div id="runstatus" class="run-status">暂无运行记录</div>
        </section>
      </aside>

      <section class="content">
        <section id="itemsTab">
          <div class="summary" id="summary"></div>

          <div class="panel">
            <div class="panel-head">
              <h2 class="panel-title">添加监控项目</h2>
              <div class="tools">
                <select id="sourcefilter"></select>
                <select id="groupfilter"></select>
                <input id="searchinput" placeholder="搜索名称、ID、地区">
              </div>
            </div>
            <div class="panel-body form-grid">
              <label class="span-2">来源
                <select id="newsource"></select>
              </label>
              <label class="span-3">名称
                <input id="newname">
              </label>
              <label class="span-3" id="newtargetlabel">目标
                <input id="newtarget">
              </label>
              <label class="span-2" id="newregionlabel">地区
                <input id="newregion">
              </label>
              <label class="span-2">分组
                <select id="newgroup"></select>
              </label>
              <label class="span-5" id="newregexlabel">RSS 正则
                <input id="newregex">
            </label>
            <label class="span-5">富媒体文件URL
              <div class="upload-field">
                <input id="newmedia">
                <button data-upload-target="newmedia" type="button">上传</button>
              </div>
            </label>
              <button id="additembtn" class="primary span-2">添加</button>
            </div>
          </div>

          <div id="sourcelist" class="source-list"></div>
        </section>

        <section id="groupsTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">分组</h2>
            <button id="addgroupbtn" class="primary">添加分组</button>
          </div>
          <div class="panel-body">
            <div class="default-group-row">
              <label>分组名称（默认）
                <input id="defaultgroupinput">
              </label>
              <label>图标URL（默认）
                <div class="upload-field">
                  <input id="defaulticoninput">
                  <button data-upload-target="defaulticoninput" type="button">上传</button>
                </div>
              </label>
              <label>Bark分组名称
                <input id="defaultarchiveinput">
              </label>
              <div></div>
            </div>
          </div>
          <div class="panel-body group-list" id="grouplist"></div>
        </section>

      <section id="displayTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">后缀与构建号比对</h2>
          </div>
          <div class="panel-body">
            <div class="rule-controls">
              <label>配置层级
                <select id="displaylevel"></select>
              </label>
              <label id="displayownerlabel">对象
                <select id="displayowner"></select>
              </label>
            </div>
            <div id="displaygrid" class="rule-block"></div>
          </div>
        </section>

        <section id="jsonTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">JSON</h2>
          </div>
          <div class="panel-body">
            <label>config.json
              <textarea id="jsoneditor" spellcheck="false"></textarea>
            </label>
            <div class="json-actions">
              <button id="applyjsonbtn">应用 JSON</button>
              <button id="formatjsonbtn">格式化</button>
            </div>
          </div>
        </section>

        <section id="settingsTab" class="panel hidden">
          <div class="panel-head">
            <h2 class="panel-title">设置</h2>
          </div>
          <div class="panel-body setting-grid">
            <label class="span-6">Worker URL
              <input id="workerurl" placeholder="https://monitor-api.example.com">
            </label>
            <label class="span-6">WebUI Token
              <input id="webuitoken" type="password" autocomplete="off">
            </label>
            <label class="span-4">页面名称
              <input id="settingbrandname">
            </label>
            <label class="span-4">浏览器标题
              <input id="settingpagetitle">
            </label>
            <label class="span-4">主题预设
              <select id="settingtheme"></select>
            </label>
            <label class="span-4">时间显示时区
              <select id="settingtimezone"></select>
            </label>
            <label class="span-6">顶部图标URL
              <div class="upload-field">
                <input id="settinglogourl">
                <button data-upload-target="settinglogourl" type="button">上传</button>
              </div>
            </label>
            <label class="span-6">标题栏图标URL
              <div class="upload-field">
                <input id="settingfaviconurl">
                <button data-upload-target="settingfaviconurl" type="button">上传</button>
              </div>
            </label>
            <label class="span-2">背景
              <input id="colorbg" class="color-input" type="color">
            </label>
            <label class="span-2">侧边栏
              <input id="colorsidebar" class="color-input" type="color">
            </label>
            <label class="span-2">面板
              <input id="colorpanel" class="color-input" type="color">
            </label>
            <label class="span-2">文字
              <input id="colortext" class="color-input" type="color">
            </label>
            <label class="span-2">弱文字
              <input id="colormuted" class="color-input" type="color">
            </label>
            <label class="span-2">强调色
              <input id="coloraccent" class="color-input" type="color">
            </label>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const SOURCES = {
      "App Store": { key: "app_store_list", target: "App ID", region: true, defaultregion: "cn" },
      "Google Play": { key: "google_play_list", target: "包名", region: true, defaultregion: "us" },
      "TapTap": { key: "taptap_list", target: "TapTap ID", region: false },
      "GitHub": { key: "github_repo_list", target: "owner/repo", region: false },
      "RSS": { key: "rss_list", target: "RSS 链接", region: false },
    };
    const SOURCE_NAMES = Object.keys(SOURCES);
    const ITEMS_PER_PAGE = 5;
    const storage = window.localStorage;
    const el = (id) => document.getElementById(id);
    const TIMEZONES = getSupportedTimezones();

    const THEMES = {
      quiet: {
        name: "清爽",
        bg: "#f6f7f4",
        sidebar: "#eef1eb",
        panel: "#ffffff",
        text: "#1f2a24",
        muted: "#66736b",
        accent: "#0f766e",
      },
      light: {
        name: "明亮",
        bg: "#f7f8fb",
        sidebar: "#edf1f7",
        panel: "#ffffff",
        text: "#18202a",
        muted: "#607083",
        accent: "#2563eb",
      },
      graphite: {
        name: "石墨",
        bg: "#f3f2ef",
        sidebar: "#e7e3dc",
        panel: "#ffffff",
        text: "#26231f",
        muted: "#746d64",
        accent: "#5f6f52",
      },
      custom: {
        name: "自定义",
        bg: "#f6f7f4",
        sidebar: "#eef1eb",
        panel: "#ffffff",
        text: "#1f2a24",
        muted: "#66736b",
        accent: "#0f766e",
      },
    };

    let state = {
      config: null,
      sha: null,
      validation: null,
      activeTab: "items",
      display: { level: "global", owner: "" },
      activesource: "",
      activegroup: "",
      sourcepages: {},
      grouppages: {},
      settings: loadSettings(),
      savedjson: "",
      dirty: false,
      validateTimer: null,
      validating: false,
      runTimer: null,
      loadRetryTimer: null,
      statusTimer: null,
    };

    function baseConfig() {
      return {
        app_store_list: [],
        google_play_list: [],
        taptap_list: [],
        github_repo_list: [],
        rss_list: [],
        build_number_check: { global: Object.fromEntries(SOURCE_NAMES.map((source) => [source, false])), groups: {}, apps: {} },
        rss_regex_rules: {},
        suffix_config: { global: Object.fromEntries(SOURCE_NAMES.map((source) => [source, [source, true]])), groups: {}, apps: {} },
        notification_groups: {},
        default_group: "其他更新",
        notification_icons: {},
        default_icon: "",
        rich_media_config: {},
        bark_archive_mapping: {},
      };
    }

    function normalizeConfig(config) {
      const defaults = baseConfig();
      const normalized = { ...defaults, ...(config || {}) };
      for (const meta of Object.values(SOURCES)) {
        normalized[meta.key] = Array.isArray(normalized[meta.key]) ? normalized[meta.key] : [];
      }
      normalized.build_number_check = {
        global: { ...defaults.build_number_check.global, ...(normalized.build_number_check?.global || {}) },
        groups: normalized.build_number_check?.groups || {},
        apps: normalized.build_number_check?.apps || {},
      };
      normalized.suffix_config = {
        global: { ...defaults.suffix_config.global, ...(normalized.suffix_config?.global || {}) },
        groups: normalized.suffix_config?.groups || {},
        apps: normalized.suffix_config?.apps || {},
      };
      normalized.notification_groups = normalized.notification_groups || {};
      normalized.rss_regex_rules = normalized.rss_regex_rules || {};
      normalized.notification_icons = normalized.notification_icons || {};
      normalized.rich_media_config = normalized.rich_media_config || {};
      normalized.bark_archive_mapping = normalized.bark_archive_mapping || {};
      return normalized;
    }

    function loadSettings() {
      const raw = storage.getItem("monitor.settings");
      const parsed = raw ? safeJson(raw, {}) : {};
      return {
        workerurl: storage.getItem("monitor.workerurl") || parsed.workerurl || "",
        webuitoken: storage.getItem("monitor.webuitoken") || parsed.webuitoken || "",
        brandname: parsed.brandname || "Monitor",
        pagetitle: parsed.pagetitle || "Monitor",
        logourl: parsed.logourl || "",
        faviconurl: parsed.faviconurl || "",
        assetversion: parsed.assetversion || Date.now(),
        timezone: parsed.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Hong_Kong",
        theme: parsed.theme || "quiet",
        colors: { ...THEMES.quiet, ...(parsed.colors || {}) },
      };
    }

    function saveSettings() {
      storage.setItem("monitor.settings", JSON.stringify(state.settings));
      storage.setItem("monitor.workerurl", state.settings.workerurl || "");
      storage.setItem("monitor.webuitoken", state.settings.webuitoken || "");
      applySettings();
    }

    function applySettings() {
      const settings = state.settings;
      document.title = settings.pagetitle || "Monitor";
      el("brandname").textContent = settings.brandname || "Monitor";
      const favicon = el("favicon");
      if (settings.faviconurl) {
        favicon.href = versionedAssetUrl(settings.faviconurl, settings.assetversion);
      } else {
        favicon.removeAttribute("href");
      }

      const mark = el("brandmark");
      if (settings.logourl) {
        mark.classList.add("has-image");
        mark.innerHTML = `<img alt="" src="${escapeAttr(versionedAssetUrl(settings.logourl, settings.assetversion))}">`;
      } else {
        mark.classList.remove("has-image");
        mark.textContent = (settings.brandname || "Monitor").trim().charAt(0).toUpperCase() || "M";
      }

      const colors = settings.colors || THEMES.quiet;
      const root = document.documentElement;
      root.style.setProperty("--bg", colors.bg);
      root.style.setProperty("--sidebar", colors.sidebar);
      root.style.setProperty("--panel", colors.panel);
      root.style.setProperty("--text", colors.text);
      root.style.setProperty("--muted", colors.muted);
      root.style.setProperty("--accent", colors.accent);
      root.style.setProperty("--accent-soft", mixHex(colors.accent, "#ffffff", 0.82));
      fillSettingsForm();
    }

    function versionedAssetUrl(url, version) {
      if (!url) return "";
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}v=${encodeURIComponent(version || Date.now())}`;
    }

    function workerurl() {
      return (state.settings.workerurl || "").trim().replace(/\/$/, "");
    }

    function headers() {
      const token = (state.settings.webuitoken || "").trim();
      return {
        "Content-Type": "application/json",
        ...(token ? { "Authorization": `Bearer ${token}` } : {}),
      };
    }

    function authHeaders() {
      const token = (state.settings.webuitoken || "").trim();
      return token ? { "Authorization": `Bearer ${token}` } : {};
    }

    async function api(path, options = {}) {
      const base = workerurl();
      if (!base) {
        throw new Error("Worker URL 为空");
      }
      const requestHeaders = options.body instanceof FormData ? authHeaders() : headers();
      const response = await fetch(`${base}${path}`, {
        ...options,
        headers: { ...requestHeaders, ...(options.headers || {}) },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || data.errors?.join("; ") || `HTTP ${response.status}`);
        error.data = data;
        throw error;
      }
      return data;
    }

    function setStatus(text, kind = "", options = {}) {
      const target = el("status");
      window.clearTimeout(state.statusTimer);
      target.textContent = text;
      target.className = `status ${kind}`.trim();
      updateStatusVisibility();
      const persist = options.persist ?? isPersistentStatus(text, kind);
      if (!persist) {
        state.statusTimer = window.setTimeout(() => clearStatus(), options.timeout || 3000);
      }
    }

    function clearStatus() {
      window.clearTimeout(state.statusTimer);
      const target = el("status");
      target.textContent = "";
      target.className = "status hidden";
      if (state.dirty && !state.validating) {
        setStatus("有未保存改动", "warn", { persist: true });
      }
    }

    function isPersistentStatus(text, kind) {
      if (!text) return false;
      if (kind === "error") return true;
      return [
        "读取中",
        "自动校验中",
        "校验中",
        "保存中",
        "触发中",
      ].includes(text) || text.includes("未保存") || text.startsWith("读取失败，正在重试") || text.startsWith("读取失败：");
    }

    function updateStatusVisibility() {
      const target = el("status");
      target.classList.toggle("hidden", state.activeTab === "settings" || !target.textContent.trim());
    }

    function setRetryStatus(text) {
      const target = el("status");
      window.clearTimeout(state.statusTimer);
      target.className = "status error";
      target.innerHTML = `${escapeHtml(text)} <button id="retryloadbtn" type="button">重试</button>`;
      updateStatusVisibility();
      el("retryloadbtn").addEventListener("click", () => {
        loadConfigWithRetry({ force: true }).catch((error) => setRetryStatus(error.message));
      });
    }

    function showToast(message, kind = "ok", timeout = 3000) {
      const host = el("toasthost");
      const toast = document.createElement("div");
      toast.className = `toast ${kind}`.trim();
      toast.innerHTML = `<div>${escapeHtml(message)}</div><button type="button" title="关闭">×</button>`;
      const close = () => toast.remove();
      toast.querySelector("button").addEventListener("click", close);
      host.appendChild(toast);
      window.setTimeout(close, timeout);
    }

    function configJson() {
      return JSON.stringify(state.config || {});
    }

    function setCleanSnapshot() {
      state.savedjson = configJson();
      state.dirty = false;
      updateDirtyUi();
    }

    function markDirty() {
      state.dirty = state.savedjson !== configJson();
      updateDirtyUi();
      scheduleValidation();
    }

    function updateDirtyUi() {
      if (state.dirty) {
        el("savebtn").classList.add("primary");
        if (!state.validating) setStatus("有未保存改动", "warn");
      } else {
        el("savebtn").classList.add("primary");
        if (el("status").textContent.trim() === "有未保存改动") clearStatus();
      }
    }

    function scheduleValidation() {
      if (!state.config || !workerurl()) return;
      window.clearTimeout(state.validateTimer);
      state.validateTimer = window.setTimeout(() => {
        validateConfigRemote({ automatic: true }).catch((error) => setStatus(error.message, "error"));
      }, 650);
    }

    function getGroups(includedefault = true) {
      if (!state.config) return [];
      const groups = Object.keys(state.config.notification_groups || {});
      if (includedefault && state.config.default_group && !groups.includes(state.config.default_group)) {
        groups.push(state.config.default_group);
      }
      return groups;
    }

    function groupOf(name) {
      for (const [group, names] of Object.entries(state.config.notification_groups || {})) {
        if (Array.isArray(names) && names.includes(name)) return group;
      }
      return state.config.default_group || "";
    }

    function setGroup(name, group) {
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(name);
        if (index >= 0) names.splice(index, 1);
      }
      if (group && group !== state.config.default_group) {
        state.config.notification_groups[group] ||= [];
        if (!state.config.notification_groups[group].includes(name)) {
          state.config.notification_groups[group].push(name);
        }
      }
    }

    function getItems(sourcefilter = "") {
      if (!state.config) return [];
      return SOURCE_NAMES
        .filter((source) => !sourcefilter || source === sourcefilter)
        .flatMap((source) => {
          const meta = SOURCES[source];
          return (state.config[meta.key] || []).map((item, index) => ({
            source,
            meta,
            index,
            item,
            name: item[0] || "",
            target: item[1] || "",
            region: item[2] || "",
          }));
        });
    }

    function renameItem(oldname, newname) {
      if (!oldname || !newname || oldname === newname) return;
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(oldname);
        if (index >= 0) names[index] = newname;
      }
      moveKey(state.config.rich_media_config, oldname, newname);
      moveKey(state.config.rss_regex_rules, oldname, newname);
      moveKey(state.config.build_number_check.apps, oldname, newname);
      moveKey(state.config.suffix_config.apps, oldname, newname);
    }

    function moveKey(object, oldkey, newkey) {
      if (object && Object.prototype.hasOwnProperty.call(object, oldkey) && !Object.prototype.hasOwnProperty.call(object, newkey)) {
        object[newkey] = object[oldkey];
        delete object[oldkey];
      }
    }

    function setItemField(ref, field, value) {
      const item = state.config[ref.meta.key][ref.index];
      if (field === "name") {
        const oldname = item[0];
        item[0] = value;
        renameItem(oldname, value);
      }
      if (field === "target") item[1] = value;
      if (field === "region" && ref.meta.region) item[2] = value;
    }

    function cleanupItem(name) {
      for (const names of Object.values(state.config.notification_groups || {})) {
        const index = names.indexOf(name);
        if (index >= 0) names.splice(index, 1);
      }
      delete state.config.rich_media_config[name];
      delete state.config.rss_regex_rules[name];
      delete state.config.build_number_check.apps[name];
      delete state.config.suffix_config.apps[name];
    }

    function render() {
      renderSummary();
      renderFilters();
      renderItems();
      renderGroups();
      renderDisplay();
      renderJson();
      renderMessages();
      renderTab();
      applySettings();
    }

    function renderSummary() {
      const summary = el("summary");
      const counts = SOURCE_NAMES.map((source) => [source, state.config ? state.config[SOURCES[source].key].length : 0]);
      const columns = summaryColumns();
      const blanks = (columns - (counts.length % columns)) % columns;
      summary.innerHTML = [
        ...counts.map(([label, value]) => `<div class="metric"><span>${escapeHtml(label)}</span><strong>${value}</strong></div>`),
        ...Array.from({ length: blanks }, () => `<div class="metric empty" aria-hidden="true"></div>`),
      ].join("");
    }

    function summaryColumns() {
      return window.matchMedia("(max-width: 1060px)").matches ? 2 : 5;
    }

    function renderFilters() {
      fillSelect(el("sourcefilter"), [["全部来源", ""], ...SOURCE_NAMES.map((source) => [source, source])], el("sourcefilter").value);
      fillSelect(el("groupfilter"), [["全部分组", ""], ...getGroups().map((group) => [group, group])], el("groupfilter").value);
      fillSelect(el("newsource"), SOURCE_NAMES.map((source) => [source, source]), el("newsource").value || "App Store");
      fillSelect(el("newgroup"), getGroups().map((group) => [group, group]), el("newgroup").value || state.config?.default_group || "");
      syncNewSourceFields();
    }

    function renderItems() {
      const container = el("sourcelist");
      if (!state.config) {
        container.innerHTML = "";
        return;
      }
      const sourcefilter = el("sourcefilter").value;
      const groupfilter = el("groupfilter").value;
      const query = el("searchinput").value.trim().toLowerCase();

      const sourcegroups = SOURCE_NAMES
        .filter((source) => !sourcefilter || source === sourcefilter)
        .map((source) => {
          const refs = getItems(source).filter((ref) => {
            const haystack = [ref.source, ref.name, ref.target, ref.region, groupOf(ref.name)].join(" ").toLowerCase();
            return (!groupfilter || groupOf(ref.name) === groupfilter) && (!query || haystack.includes(query));
          });
          return { source, refs };
        });
      const sourcekeys = sourcegroups.map((group) => group.source);
      const active = sourcefilter || (sourcekeys.includes(state.activesource) ? state.activesource : sourcekeys[0]);
      state.activesource = active || "";
      const activegroup = sourcegroups.find((group) => group.source === active) || sourcegroups[0];

      container.innerHTML = activegroup
        ? `${renderSourceSwitcher(sourcegroups, active, Boolean(sourcefilter))}${renderSourceTable(activegroup.source, activegroup.refs)}`
        : "";

      container.querySelectorAll("[data-source-switch]").forEach((node) => {
        node.addEventListener("click", () => {
          state.activesource = node.dataset.sourceSwitch;
          renderItems();
        });
      });
      container.querySelector(".source-switch.active")?.scrollIntoView({ block: "nearest", inline: "center" });

      container.querySelectorAll("[data-edit]").forEach((node) => {
        node.addEventListener("change", () => {
          const ref = resolveItemRef(node);
          if (!ref) return;
          const field = node.dataset.field;
          if (field === "group") setGroup(ref.name, node.value);
          if (field === "regex") state.config.rss_regex_rules[ref.name] = node.value.trim();
          if (field === "media") state.config.rich_media_config[ref.name] = node.value.trim();
          if (["name", "target", "region"].includes(field)) setItemField(ref, field, node.value.trim());
          render();
          markDirty();
        });
      });

      container.querySelectorAll("[data-delete]").forEach((node) => {
        node.addEventListener("click", () => {
          const ref = resolveItemRef(node);
          if (!ref) return;
          state.config[ref.meta.key].splice(ref.index, 1);
          cleanupItem(ref.name);
          render();
          markDirty();
        });
      });

      container.querySelectorAll("[data-upload-kind='item-media']").forEach((node) => {
        node.addEventListener("click", async () => {
          const ref = resolveItemRef(node);
          if (!ref) return;
          const input = node.parentElement.querySelector("input");
          await uploadToInput(input, node, (url) => {
            state.config.rich_media_config[ref.name] = url;
            render();
            markDirty();
          });
        });
      });

      container.querySelectorAll("[data-page-source]").forEach((node) => {
        node.addEventListener("click", () => {
          const source = node.dataset.pageSource;
          const page = Number(node.dataset.page);
          state.sourcepages[source] = page;
          renderItems();
        });
      });
    }

    function renderSourceSwitcher(sourcegroups, active, fixed) {
      if (fixed || sourcegroups.length <= 1) return "";
      const scrollable = sourcegroups.length > 5;
      return `
        <div class="source-switcher ${scrollable ? "scrollable" : ""}" aria-label="切换来源表">
          ${sourcegroups.map(({ source }) => `
            <button class="source-switch ${source === active ? "active" : ""}" data-source-switch="${escapeAttr(source)}" type="button">
              ${escapeHtml(source)}
            </button>
          `).join("")}
        </div>`;
    }

    function renderSourceTable(source, refs) {
      const meta = SOURCES[source];
      const isrss = source === "RSS";
      const regionth = meta.region ? "<th>地区</th>" : "";
      const regexth = isrss ? "<th>RSS 正则</th>" : "";
      const totalpages = Math.max(1, Math.ceil(refs.length / ITEMS_PER_PAGE));
      const currentpage = clampPage(state.sourcepages[source] || 0, totalpages);
      state.sourcepages[source] = currentpage;
      const pageitems = refs.slice(currentpage * ITEMS_PER_PAGE, currentpage * ITEMS_PER_PAGE + ITEMS_PER_PAGE);
      const blankcount = ITEMS_PER_PAGE - pageitems.length;
      const colcount = 5 + (meta.region ? 1 : 0) + (isrss ? 1 : 0);
      return `
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">${escapeHtml(source)}</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>${escapeHtml(meta.target)}</th>
                  ${regionth}
                  <th>分组</th>
                  ${regexth}
                  <th>富媒体文件URL</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${pageitems.map((ref) => renderItemRow(ref)).join("")}
                ${Array.from({ length: blankcount }, () => renderBlankItemRow(colcount)).join("")}
              </tbody>
            </table>
          </div>
          ${renderPager(source, currentpage, totalpages)}
        </section>`;
    }

    function renderPager(source, currentpage, totalpages) {
      return `
        <div class="pager source-pager">
          <div class="pager-dots">
            ${Array.from({ length: totalpages }, (_, index) => `<button class="pager-dot ${index === currentpage ? "active" : ""}" data-page-source="${escapeAttr(source)}" data-page="${index}" title="第 ${index + 1} 页"></button>`).join("")}
          </div>
        </div>`;
    }

    function renderBlankItemRow(colcount) {
      return `<tr class="blank-row"><td colspan="${colcount}">&nbsp;</td></tr>`;
    }

    function clampPage(page, totalpages) {
      if (page < 0) return 0;
      if (page >= totalpages) return totalpages - 1;
      return page;
    }

    function renderItemRow(ref) {
      const group = groupOf(ref.name);
      const regex = state.config.rss_regex_rules[ref.name] || "";
      const media = state.config.rich_media_config[ref.name] || "";
      const regiontd = ref.meta.region ? `<td><input data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="region" value="${escapeAttr(ref.region)}"></td>` : "";
      const regextd = ref.source === "RSS" ? `<td><input data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="regex" value="${escapeAttr(regex)}"></td>` : "";
      return `
        <tr>
          <td><input data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="name" value="${escapeAttr(ref.name)}"></td>
          <td><input data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="target" value="${escapeAttr(ref.target)}"></td>
          ${regiontd}
          <td><select data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="group">${getGroups().map((item) => `<option value="${escapeAttr(item)}" ${item === group ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}</select></td>
          ${regextd}
          <td>
            <div class="upload-field">
              <input data-edit data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" data-field="media" value="${escapeAttr(media)}">
              <button data-upload-kind="item-media" data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" type="button">上传</button>
            </div>
          </td>
          <td class="tight"><button class="icon danger" data-delete data-source="${escapeAttr(ref.source)}" data-index="${ref.index}" title="删除">×</button></td>
        </tr>`;
    }

    function resolveItemRef(node) {
      const source = node.dataset.source;
      const index = Number(node.dataset.index);
      const meta = SOURCES[source];
      const item = state.config?.[meta?.key]?.[index];
      if (!meta || !item) return null;
      return { source, meta, index, item, name: item[0] || "", target: item[1] || "", region: item[2] || "" };
    }

    function renderGroups() {
      if (!state.config) return;
      el("defaultgroupinput").value = state.config.default_group || "";
      el("defaulticoninput").value = state.config.default_icon || "";
      el("defaultarchiveinput").value = state.config.bark_archive_mapping[state.config.default_group] || "";

      const list = el("grouplist");
      const groups = Object.keys(state.config.notification_groups || {});
      const active = groups.includes(state.activegroup) ? state.activegroup : groups[0];
      state.activegroup = active || "";
      list.innerHTML = active
        ? `${renderGroupSwitcher(groups, active)}${renderGroupCard(active)}`
        : "<div class=\"status\">暂无分组。</div>";

      list.querySelectorAll("[data-group-switch]").forEach((node) => {
        node.addEventListener("click", () => {
          state.activegroup = node.dataset.groupSwitch;
          renderGroups();
        });
      });

      list.querySelectorAll("[data-page-group]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.dataset.pageGroup;
          const page = Number(node.dataset.page);
          state.grouppages[group] = page;
          renderGroups();
        });
      });

      list.querySelectorAll("[data-group-field]").forEach((node) => {
        node.addEventListener("change", () => {
          const oldgroup = node.closest("[data-group]").dataset.group;
          if (node.dataset.groupField === "name") renameGroup(oldgroup, node.value.trim());
          if (node.dataset.groupField === "icon") state.config.notification_icons[oldgroup] = node.value.trim();
          if (node.dataset.groupField === "archive") state.config.bark_archive_mapping[oldgroup] = node.value.trim();
          render();
          markDirty();
        });
      });

      list.querySelectorAll("[data-delete-group]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.dataset.deleteGroup;
          delete state.config.notification_groups[group];
          delete state.config.notification_icons[group];
          delete state.config.bark_archive_mapping[group];
          delete state.config.build_number_check.groups[group];
          delete state.config.suffix_config.groups[group];
          delete state.grouppages[group];
          if (state.activegroup === group) state.activegroup = "";
          render();
          markDirty();
        });
      });

      list.querySelectorAll("[data-move-group]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.closest("[data-group]").dataset.group;
          moveGroup(group, Number(node.dataset.moveGroup));
          render();
          markDirty();
        });
      });

      list.querySelectorAll("[data-move-group-item]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.closest("[data-group]").dataset.group;
          moveGroupItem(group, Number(node.dataset.moveGroupItem), Number(node.dataset.direction));
          render();
          markDirty();
        });
      });

      list.querySelectorAll("[data-remove-group-item]").forEach((node) => {
        node.addEventListener("click", () => {
          const group = node.closest("[data-group]").dataset.group;
          state.config.notification_groups[group].splice(Number(node.dataset.removeGroupItem), 1);
          render();
          markDirty();
        });
      });

      list.querySelectorAll("[data-upload-kind='group-icon']").forEach((node) => {
        node.addEventListener("click", async () => {
          const group = node.dataset.group;
          const input = node.parentElement.querySelector("input");
          await uploadToInput(input, node, (url) => {
            state.config.notification_icons[group] = url;
            render();
            markDirty();
          });
        });
      });
    }

    function renderGroupSwitcher(groups, active) {
      if (groups.length <= 1) return "";
      return `
        <div class="group-switcher" aria-label="切换分组">
          ${groups.map((group) => `
            <button class="group-switch ${group === active ? "active" : ""}" data-group-switch="${escapeAttr(group)}" type="button">
              ${escapeHtml(group)}
            </button>
          `).join("")}
        </div>`;
    }

    function renderGroupCard(group) {
      const items = state.config.notification_groups[group] || [];
      const totalpages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
      const currentpage = clampPage(state.grouppages[group] || 0, totalpages);
      state.grouppages[group] = currentpage;
      const pageitems = items
        .map((name, index) => ({ name, index }))
        .slice(currentpage * ITEMS_PER_PAGE, currentpage * ITEMS_PER_PAGE + ITEMS_PER_PAGE);
      const blankcount = ITEMS_PER_PAGE - pageitems.length;
      return `
        <div class="group-card" data-group="${escapeAttr(group)}">
          <div class="group-row">
            <label>分组名称
              <input data-group-field="name" value="${escapeAttr(group)}">
            </label>
            <label>图标URL
              <div class="upload-field">
                <input data-group-field="icon" value="${escapeAttr(state.config.notification_icons[group] || "")}">
                <button data-upload-kind="group-icon" data-group="${escapeAttr(group)}" type="button">上传</button>
              </div>
            </label>
            <label>Bark分组名称
              <input data-group-field="archive" value="${escapeAttr(state.config.bark_archive_mapping[group] || "")}">
            </label>
            <div class="row-actions">
              <button class="icon" data-move-group="-1" title="上移">↑</button>
              <button class="icon" data-move-group="1" title="下移">↓</button>
              <button class="icon danger" data-delete-group="${escapeAttr(group)}" title="删除">×</button>
            </div>
          </div>
          <div class="group-items">
            <h4>组内排序</h4>
            ${items.length ? pageitems.map(({ name, index }) => renderGroupItemRow(name, index)).join("") : "<div class=\"status\">暂无项目，未分组项目会使用默认分组。</div>"}
            ${Array.from({ length: items.length ? blankcount : 0 }, () => renderBlankGroupItem()).join("")}
          </div>
          ${items.length ? renderGroupPager(group, currentpage, totalpages) : ""}
        </div>`;
    }

    function renderGroupItemRow(name, index) {
      return `
        <div class="group-item-row">
          <div>${escapeHtml(index + 1)}. ${escapeHtml(name)}</div>
          <div class="row-actions">
            <button class="icon" data-move-group-item="${index}" data-direction="-1" title="上移">↑</button>
            <button class="icon" data-move-group-item="${index}" data-direction="1" title="下移">↓</button>
            <button class="icon danger" data-remove-group-item="${index}" title="移出分组">×</button>
          </div>
        </div>`;
    }

    function renderBlankGroupItem() {
      return `
        <div class="group-item-row blank-row">
          <div>&nbsp;</div>
          <div>&nbsp;</div>
        </div>`;
    }

    function renderGroupPager(group, currentpage, totalpages) {
      return `
        <div class="pager">
          <button class="icon" data-page-group="${escapeAttr(group)}" data-page="${Math.max(0, currentpage - 1)}" ${currentpage === 0 ? "disabled" : ""} title="上一页">‹</button>
          <div class="pager-dots">
            ${Array.from({ length: totalpages }, (_, index) => `<button class="pager-dot ${index === currentpage ? "active" : ""}" data-page-group="${escapeAttr(group)}" data-page="${index}" title="第 ${index + 1} 页"></button>`).join("")}
          </div>
          <button class="icon" data-page-group="${escapeAttr(group)}" data-page="${Math.min(totalpages - 1, currentpage + 1)}" ${currentpage >= totalpages - 1 ? "disabled" : ""} title="下一页">›</button>
        </div>`;
    }

    function renameGroup(oldgroup, newgroup) {
      if (!oldgroup || !newgroup || oldgroup === newgroup) return;
      state.config.notification_groups[newgroup] = state.config.notification_groups[oldgroup] || [];
      delete state.config.notification_groups[oldgroup];
      moveKey(state.config.notification_icons, oldgroup, newgroup);
      moveKey(state.config.bark_archive_mapping, oldgroup, newgroup);
      moveKey(state.config.build_number_check.groups, oldgroup, newgroup);
      moveKey(state.config.suffix_config.groups, oldgroup, newgroup);
      state.grouppages[newgroup] = state.grouppages[oldgroup] || 0;
      delete state.grouppages[oldgroup];
      if (state.activegroup === oldgroup) state.activegroup = newgroup;
    }

    function moveGroup(group, direction) {
      const keys = Object.keys(state.config.notification_groups || {});
      const index = keys.indexOf(group);
      const next = index + direction;
      if (index < 0 || next < 0 || next >= keys.length) return;
      [keys[index], keys[next]] = [keys[next], keys[index]];
      const current = state.config.notification_groups;
      state.config.notification_groups = Object.fromEntries(keys.map((key) => [key, current[key]]));
    }

    function moveGroupItem(group, index, direction) {
      const items = state.config.notification_groups[group] || [];
      const next = index + direction;
      if (index < 0 || next < 0 || next >= items.length) return;
      [items[index], items[next]] = [items[next], items[index]];
    }

    function renderDisplay() {
      if (!state.config) return;
      renderDisplayControls();
      el("displaygrid").innerHTML = renderSelectedRules();
      bindDisplayRules();
    }

    function renderDisplayControls() {
      fillSelect(el("displaylevel"), [["来源", "global"], ["分组", "group"], ["项目", "app"]], state.display.level);
      const ownerlabel = el("displayownerlabel");
      const ownerselect = el("displayowner");
      if (state.display.level === "global") {
        ownerlabel.classList.add("hidden");
        ownerselect.innerHTML = "";
        state.display.owner = "";
        return;
      }

      ownerlabel.classList.remove("hidden");
      const options = getDisplayOwnerOptions(state.display.level);
      if (!options.some((option) => option[1] === state.display.owner)) {
        state.display.owner = options[0]?.[1] || "";
      }
      fillSelect(ownerselect, options, state.display.owner);
    }

    function getDisplayOwnerOptions(level) {
      if (level === "group") {
        return getGroups(false).map((group) => [group, group]);
      }
      const names = [...new Set(getItems().map((item) => item.name).filter(Boolean))];
      return names.map((name) => [name, name]);
    }

    function renderSelectedRules() {
      const level = state.display.level;
      const owner = state.display.owner;
      if (level === "group" && !owner) return "<div class=\"status\">暂无分组</div>";
      if (level === "app" && !owner) return "<div class=\"status\">暂无监控项目</div>";

      const title = level === "global" ? "来源配置" : level === "group" ? `分组配置：${owner}` : `项目配置：${owner}`;
      const sources = level === "app"
        ? getItems().filter((item) => item.name === owner).map((item) => item.source)
        : SOURCE_NAMES;

      return `
        <section class="rule-section">
          <h3>${escapeHtml(title)}</h3>
          ${level === "global"
            ? "<div class=\"status\">来源配置是兜底配置。构建号比对开启时，1.0(1) 与 1.0(2) 视为不同版本，通知也保留括号内容；关闭时忽略括号内容，通知也去掉括号内容。</div>"
            : "<div class=\"status\">项目配置优先于分组配置，分组配置优先于来源配置。选择使用上一级配置会删除这一层配置，输入框内显示的是最终生效值。</div>"}
          ${ruleHeader(level === "global")}
          ${sources.map((source) => ruleRow(ruleState(level, owner, source))).join("")}
        </section>`;
    }

    function ruleState(level, owner, source) {
      if (level === "global") {
        return {
          level,
          owner: "global",
          source,
          suffixmode: "override",
          suffix: state.config.suffix_config.global[source] || [source, true],
          buildmode: "override",
          build: Boolean(state.config.build_number_check.global[source]),
          fixed: true,
        };
      }

      const bucket = level === "group" ? "groups" : "apps";
      const suffixvalue = state.config.suffix_config[bucket]?.[owner]?.[source];
      const buildvalue = state.config.build_number_check[bucket]?.[owner]?.[source];
      const effectivesuffix = getEffectiveSuffixConfig(level, owner, source);
      const effectivebuild = getEffectiveBuildConfig(level, owner, source);
      const suffixlabels = ruleConfigLabels(level, owner, source, "suffix");
      const buildlabels = ruleConfigLabels(level, owner, source, "build");
      return {
        level,
        owner,
        source,
        suffixmode: suffixvalue ? "override" : "inherit",
        suffix: suffixvalue || effectivesuffix,
        suffixlabels,
        buildmode: buildvalue === undefined ? "inherit" : "override",
        build: buildvalue === undefined ? effectivebuild : Boolean(buildvalue),
        buildlabels,
        fixed: false,
      };
    }

    function getEffectiveSuffixConfig(level, owner, source) {
      if (level === "app") {
        const appvalue = state.config.suffix_config.apps?.[owner]?.[source];
        if (appvalue) return [...appvalue];
        const group = findConfiguredGroup(owner);
        const groupvalue = group ? state.config.suffix_config.groups?.[group]?.[source] : null;
        if (groupvalue) return [...groupvalue];
      }
      if (level === "group") {
        const groupvalue = state.config.suffix_config.groups?.[owner]?.[source];
        if (groupvalue) return [...groupvalue];
      }
      return [...(state.config.suffix_config.global?.[source] || [source, true])];
    }

    function getEffectiveBuildConfig(level, owner, source) {
      if (level === "app") {
        const appvalue = state.config.build_number_check.apps?.[owner]?.[source];
        if (appvalue !== undefined) return Boolean(appvalue);
        const group = findConfiguredGroup(owner);
        const groupvalue = group ? state.config.build_number_check.groups?.[group]?.[source] : undefined;
        if (groupvalue !== undefined) return Boolean(groupvalue);
      }
      if (level === "group") {
        const groupvalue = state.config.build_number_check.groups?.[owner]?.[source];
        if (groupvalue !== undefined) return Boolean(groupvalue);
      }
      return Boolean(state.config.build_number_check.global?.[source]);
    }

    function findConfiguredGroup(name) {
      for (const [group, names] of Object.entries(state.config.notification_groups || {})) {
        if (Array.isArray(names) && names.includes(name)) return group;
      }
      return "";
    }

    function ruleConfigLabels(level, owner, source, kind) {
      if (level === "global") {
        return { inherit: "使用来源配置", override: "使用来源配置" };
      }
      if (level === "group") {
        return { inherit: "使用来源配置", override: "使用分组配置" };
      }
      const group = findConfiguredGroup(owner);
      const hasgroup = kind === "suffix"
        ? Boolean(group && state.config.suffix_config.groups?.[group]?.[source])
        : group && state.config.build_number_check.groups?.[group]?.[source] !== undefined;
      return { inherit: hasgroup ? "使用分组配置" : "使用来源配置", override: "使用项目配置" };
    }

    function buildText(value) {
      return value ? "开启比对并保留括号" : "关闭比对并去除括号";
    }

    function ruleHeader(global) {
      return `
        <div class="rule-grid header">
          <div>来源</div>
          <div>${global ? "后缀配置" : "后缀配置"}</div>
          <div>推送后缀文本</div>
          <div>推送时显示后缀</div>
          <div>构建号比对配置</div>
        </div>`;
    }

    function ruleRow(data) {
      const suffixdisabled = !data.fixed && data.suffixmode === "inherit";
      return `
        <div class="rule-grid">
          <div>${escapeHtml(data.source)}</div>
          <select data-rule data-level="${escapeAttr(data.level)}" data-owner="${escapeAttr(data.owner)}" data-source="${escapeAttr(data.source)}" data-field="suffixmode" ${data.fixed ? "disabled" : ""}>
            <option value="inherit" ${data.suffixmode === "inherit" ? "selected" : ""}>${escapeHtml(data.suffixlabels?.inherit || "使用来源配置")}</option>
            <option value="override" ${data.suffixmode === "override" ? "selected" : ""}>${escapeHtml(data.suffixlabels?.override || "使用来源配置")}</option>
          </select>
          <input data-rule data-level="${escapeAttr(data.level)}" data-owner="${escapeAttr(data.owner)}" data-source="${escapeAttr(data.source)}" data-field="suffixtext" value="${escapeAttr(data.suffix[0] || "")}" ${suffixdisabled ? "disabled" : ""}>
          <select data-rule data-level="${escapeAttr(data.level)}" data-owner="${escapeAttr(data.owner)}" data-source="${escapeAttr(data.source)}" data-field="suffixvisible" ${suffixdisabled ? "disabled" : ""}>
            <option value="true" ${data.suffix[1] ? "selected" : ""}>是</option>
            <option value="false" ${!data.suffix[1] ? "selected" : ""}>否</option>
          </select>
          <select data-rule data-level="${escapeAttr(data.level)}" data-owner="${escapeAttr(data.owner)}" data-source="${escapeAttr(data.source)}" data-field="buildconfig">
            ${data.fixed ? "" : `<option value="inherit" ${data.buildmode === "inherit" ? "selected" : ""}>${escapeHtml(data.buildlabels?.inherit || "使用来源配置")}：${escapeHtml(buildText(data.build))}</option>`}
            <option value="true" ${data.buildmode === "override" && data.build ? "selected" : ""}>${escapeHtml(data.buildlabels?.override || "使用来源配置")}：开启比对并保留括号</option>
            <option value="false" ${data.buildmode === "override" && !data.build ? "selected" : ""}>${escapeHtml(data.buildlabels?.override || "使用来源配置")}：关闭比对并去除括号</option>
          </select>
        </div>`;
    }

    function bindDisplayRules() {
      el("displaygrid").querySelectorAll("[data-rule]").forEach((node) => {
        node.addEventListener("change", () => {
          updateRule(node);
          renderDisplay();
          renderJson();
          markDirty();
        });
      });
    }

    function updateRule(node) {
      const level = node.dataset.level;
      const owner = node.dataset.owner;
      const source = node.dataset.source;
      const field = node.dataset.field;
      const suffixroot = level === "global" ? state.config.suffix_config.global : ensureNested(state.config.suffix_config, level, owner);
      const buildroot = level === "global" ? state.config.build_number_check.global : ensureNested(state.config.build_number_check, level, owner);

      if (field === "suffixmode") {
        if (node.value === "override") suffixroot[source] = suffixroot[source] || getEffectiveSuffixConfig(level, owner, source);
        else delete suffixroot[source];
      }
      if (field === "suffixtext") {
        suffixroot[source] = suffixroot[source] || ["", true];
        suffixroot[source][0] = node.value;
      }
      if (field === "suffixvisible") {
        suffixroot[source] = suffixroot[source] || ["", true];
        suffixroot[source][1] = node.value === "true";
      }
      if (field === "buildconfig") {
        if (node.value === "inherit" && level !== "global") {
          delete buildroot[source];
        } else {
          buildroot[source] = node.value === "true";
        }
      }
    }

    function ensureNested(root, level, owner) {
      const bucket = level === "group" ? "groups" : "apps";
      root[bucket] ||= {};
      root[bucket][owner] ||= {};
      return root[bucket][owner];
    }

    function renderJson() {
      if (!state.config) return;
      const editor = el("jsoneditor");
      if (document.activeElement !== editor) {
        editor.value = JSON.stringify(state.config, null, 2);
      }
    }

    function renderMessages() {
      const box = el("messages");
      const validation = state.validation;
      if (!validation) {
        box.innerHTML = "<div class=\"status\">暂无校验结果</div>";
        return;
      }
      const errors = validation.errors || [];
      const warnings = validation.warnings || [];
      const errorhtml = errors.length ? `<div class="status error">错误 ${errors.length}</div><ul>${errors.map((msg) => `<li>${escapeHtml(msg)}</li>`).join("")}</ul>` : "<div class=\"status ok\">无错误</div>";
      const warnhtml = warnings.length ? `<div class="status warn">警告 ${warnings.length}</div><ul>${warnings.map((msg) => `<li>${escapeHtml(msg)}</li>`).join("")}</ul>` : "<div class=\"status ok\">无警告</div>";
      box.innerHTML = errorhtml + warnhtml;
    }

    function renderTab() {
      for (const name of ["items", "groups", "display", "json", "settings"]) {
        el(`${name}Tab`).classList.toggle("hidden", state.activeTab !== name);
        document.querySelector(`[data-tab="${name}"]`).classList.toggle("active", state.activeTab === name);
      }
      el("topactions").classList.toggle("hidden", state.activeTab === "settings");
      updateStatusVisibility();
    }

    function fillSettingsForm() {
      if (!el("workerurl")) return;
      el("workerurl").value = state.settings.workerurl || "";
      el("webuitoken").value = state.settings.webuitoken || "";
      el("settingbrandname").value = state.settings.brandname || "Monitor";
      el("settingpagetitle").value = state.settings.pagetitle || "Monitor";
      fillSelect(el("settingtimezone"), TIMEZONES.map((timezone) => [timezoneLabel(timezone), timezone]), state.settings.timezone || "Asia/Hong_Kong");
      el("settinglogourl").value = state.settings.logourl || "";
      el("settingfaviconurl").value = state.settings.faviconurl || "";
      fillSelect(el("settingtheme"), Object.entries(THEMES).map(([key, theme]) => [theme.name, key]), state.settings.theme);
      el("colorbg").value = state.settings.colors.bg;
      el("colorsidebar").value = state.settings.colors.sidebar;
      el("colorpanel").value = state.settings.colors.panel;
      el("colortext").value = state.settings.colors.text;
      el("colormuted").value = state.settings.colors.muted;
      el("coloraccent").value = state.settings.colors.accent;
    }

    function fillSelect(select, options, value) {
      const current = value ?? select.value;
      select.innerHTML = options.map(([label, val]) => `<option value="${escapeAttr(val)}" ${String(val) === String(current) ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
    }

    function syncNewSourceFields() {
      const source = el("newsource").value || "App Store";
      const meta = SOURCES[source];
      el("newtargetlabel").firstChild.textContent = `${meta.target}\n`;
      el("newregionlabel").classList.toggle("hidden", !meta.region);
      el("newregexlabel").classList.toggle("hidden", source !== "RSS");
      if (meta.region && !el("newregion").value) el("newregion").value = meta.defaultregion || "";
    }

    function addItem() {
      const source = el("newsource").value;
      const meta = SOURCES[source];
      const name = el("newname").value.trim();
      const target = el("newtarget").value.trim();
      const region = el("newregion").value.trim() || meta.defaultregion || "";
      if (!name || !target) {
        setStatus("名称和目标不能为空", "error");
        return;
      }
      state.config[meta.key].push(meta.region ? [name, target, region] : [name, target]);
      setGroup(name, el("newgroup").value);
      const regex = el("newregex").value.trim();
      const media = el("newmedia").value.trim();
      if (source === "RSS" && regex) state.config.rss_regex_rules[name] = regex;
      if (media) state.config.rich_media_config[name] = media;
      el("newname").value = "";
      el("newtarget").value = "";
      el("newregex").value = "";
      el("newmedia").value = "";
      render();
      markDirty();
      setStatus("已添加", "ok");
    }

    async function loadConfig(options = {}) {
      if (!options.force && state.dirty && !window.confirm("当前有未保存改动。继续读取会覆盖这些改动，是否继续？")) {
        return;
      }
      saveSettings();
      setStatus("读取中");
      await readConfigOnce();
    }

    async function readConfigOnce() {
      const data = await api("/api/config");
      state.config = normalizeConfig(data.config);
      state.sha = data.sha;
      state.validation = data.validation;
      el("repoline").textContent = `${data.path || "config.json"} @ ${data.branch || "main"}`;
      render();
      setCleanSnapshot();
      setStatus(data.ok ? "已读取" : "配置有错误", data.ok ? "ok" : "error");
    }

    async function loadConfigWithRetry(options = {}) {
      if (!options.force && state.dirty && !window.confirm("当前有未保存改动。继续读取会覆盖这些改动，是否继续？")) {
        return;
      }
      saveSettings();
      window.clearTimeout(state.loadRetryTimer);
      const delays = [0, 1000, 3000, 5000];
      let lasterror = null;
      for (let attempt = 0; attempt < delays.length; attempt += 1) {
        if (delays[attempt]) await sleep(delays[attempt]);
        try {
          setStatus(attempt ? `读取失败，正在重试 ${attempt}/${delays.length - 1}` : "读取中", attempt ? "warn" : "");
          await readConfigOnce();
          return;
        } catch (error) {
          lasterror = error;
        }
      }
      setRetryStatus(`读取失败：${lasterror?.message || "未知错误"}`);
      throw lasterror;
    }

    async function validateConfigRemote(options = {}) {
      saveSettings();
      syncJsonToState();
      if (!state.config) return false;
      state.validating = true;
      setStatus(options.automatic ? "自动校验中" : "校验中");
      let data;
      try {
        data = await api("/api/config/validate", {
          method: "POST",
          body: JSON.stringify({ config: state.config }),
        });
      } catch (error) {
        if (error.data?.errors || error.data?.warnings) data = error.data;
        else {
          state.validating = false;
          throw error;
        }
      }
      state.validation = data;
      renderMessages();
      state.validating = false;
      if (state.dirty && data.ok) {
        setStatus("校验通过，有未保存改动", "warn");
      } else {
        setStatus(data.ok ? "校验通过" : "校验失败", data.ok ? "ok" : "error");
      }
      return data.ok;
    }

    async function saveConfig() {
      saveSettings();
      syncJsonToState();
      setStatus("保存中");
      const data = await api("/api/config", {
        method: "PUT",
        body: JSON.stringify({ config: state.config, message: "Update monitor config from WebUI" }),
      });
      state.validation = data.validation;
      renderMessages();
      setCleanSnapshot();
      setStatus("已保存", "ok");
    }

    async function runWorkflow() {
      saveSettings();
      if (state.dirty && !window.confirm("当前有未保存改动。运行会使用 GitHub 上最后保存的配置，是否继续？")) {
        return;
      }
      setStatus("触发中");
      const data = await api("/api/run", { method: "POST", body: "{}" });
      renderRunStatus(data.run, "已触发");
      setStatus(`已触发 ${data.workflow}`, "ok");
      startRunPolling();
    }

    async function refreshLatestRun() {
      const data = await api("/api/run/latest");
      renderRunStatus(data.run, "最近运行");
      return data.run;
    }

    function renderRunStatus(run, label = "运行状态") {
      const box = el("runstatus");
      if (!run) {
        box.textContent = "暂无运行记录";
        return;
      }
      const conclusion = run.conclusion || "进行中";
      box.innerHTML = `
        <div class="status ${run.conclusion === "success" ? "ok" : run.conclusion ? "error" : "warn"}">${escapeHtml(label)}：${escapeHtml(run.status)} / ${escapeHtml(conclusion)}</div>
        <div>分支：${escapeHtml(run.branch || "")}</div>
        <div>更新：${escapeHtml(formatTime(run.updated_at || run.created_at))}</div>
        <a href="${escapeAttr(run.html_url)}" target="_blank" rel="noreferrer">打开 GitHub Actions 运行记录</a>
        <div id="runjobs">读取步骤中...</div>`;
      refreshRunJobs(run.id).catch(() => {
        const jobs = el("runjobs");
        if (jobs) jobs.textContent = "步骤读取失败";
      });
    }

    async function refreshRunJobs(runid) {
      const data = await api(`/api/run/${runid}/jobs`);
      const box = el("runjobs");
      if (!box) return;
      if (!data.jobs?.length) {
        box.textContent = "暂无步骤信息";
        return;
      }
      const failed = findFailedRunPart(data.jobs);
      const summary = failed ? `
        <div class="failure-summary">
          <div>失败 Job：${escapeHtml(failed.job.name)}</div>
          ${failed.step ? `<div>失败 Step：${escapeHtml(failed.step.name)}</div>` : ""}
        </div>` : "";
      box.innerHTML = summary + data.jobs.map((job) => `
        <div>
          <strong>${escapeHtml(job.name)}</strong>：${escapeHtml(job.status)} / ${escapeHtml(job.conclusion || "进行中")}
          <ul>${(job.steps || []).map((step) => `<li class="${step.conclusion === "failure" ? "failed-step" : ""}">${escapeHtml(step.number)}. ${escapeHtml(step.name)}：${escapeHtml(step.status)} / ${escapeHtml(step.conclusion || "进行中")}${step.completed_at ? `，${escapeHtml(formatTime(step.completed_at))}` : ""}</li>`).join("")}</ul>
        </div>`).join("");
    }

    function findFailedRunPart(jobs) {
      const job = (jobs || []).find((item) => item.conclusion === "failure");
      if (!job) return null;
      const step = (job.steps || []).find((item) => item.conclusion === "failure");
      return { job, step };
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const timezone = state.settings.timezone || "Asia/Hong_Kong";
      try {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: timezone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).formatToParts(date).reduce((acc, part) => {
          acc[part.type] = part.value;
          return acc;
        }, {});
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
      } catch {
        return value.replace("T", " ").replace("Z", "");
      }
    }

    function startRunPolling() {
      window.clearInterval(state.runTimer);
      let count = 0;
      state.runTimer = window.setInterval(async () => {
        count += 1;
        try {
          const run = await refreshLatestRun();
          if (run?.conclusion || count >= 24) {
            window.clearInterval(state.runTimer);
          }
        } catch {
          if (count >= 3) window.clearInterval(state.runTimer);
        }
      }, 5000);
    }

    async function uploadToInput(input, button, ondone) {
      const selectedfile = await chooseImageFile();
      if (!selectedfile) return;
      const file = await editImageFile(selectedfile);
      if (!file) return;
      const originalText = button?.textContent || "上传";
      try {
        if (button) {
          button.disabled = true;
          button.textContent = "上传中";
        }
        const form = new FormData();
        form.append("file", file);
        const data = await api("/api/upload", { method: "POST", body: form });
        input.value = data.url;
        ondone(data.url);
        showToast("图片已上传", "ok");
      } catch (error) {
        showToast(error.message, "error", 5200);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    function chooseImageFile() {
      return new Promise((resolve) => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
